steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/google-cloud/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
substitutions:
  _REGION: asia-south1
  _REPOSITORY: webguide
  _IMAGE: webguide-ai
  _TAG: manual
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
