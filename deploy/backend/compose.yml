services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/backend/Dockerfile
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4318:8080"
    volumes:
      - evidence:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256mb
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp_profile.json
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/health',{headers:{Host:'127.0.0.1:8080'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  evidence:
